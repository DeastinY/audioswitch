name: check
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv tool install .
      - name: Exercise the Windows backend
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --with . python tests/smoke_windows.py
      - name: Sidetone probe loads
        run: uv run --with pycaw python tools/win_sidetone_probe.py
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv tool install .
      - run: uv run --with . python -c "import audioswitch.linux"
